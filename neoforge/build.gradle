plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    implementation("de.lardtom:propwash-neoforge-${minecraft_version}:${propwash_version}")
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file(rootProject.camRunDirs.client))
        }
        clientSelftest {
            client()
            sourceSet = sourceSets.devtest
            gameDirectory = this.mkdir(this.file(rootProject.camRunDirs.selftest))
            systemProperty('camdrones.selftest', 'true')
        }
        clientSmoke {
            client()
            sourceSet = sourceSets.devtest
            gameDirectory = this.mkdir(this.file(rootProject.camRunDirs.smoke))
            systemProperty('camdrones.smoketest', 'true')
        }
        serverSmoke {
            server()
            sourceSet = sourceSets.devtest
            gameDirectory = this.mkdir(this.file(rootProject.camRunDirs.serverSmoke))
            systemProperty('camdrones.serversmoke', 'true')
            programArgument('--nogui')
        }
        server {
            server()
            this.file(rootProject.camRunDirs.server).createParentDirectories()
            gameDirectory = this.mkdir(this.file(rootProject.camRunDirs.server))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.devtest
        }
    }
}

tasks.matching { it.name in ['runClient', 'runServer', 'runClientSelftest', 'runClientSmoke'] }.configureEach {
    dependsOn(rootProject.tasks.named('prepareRuns'))
}
tasks.matching { it.name in ['runServerSmoke'] }.configureEach {
    dependsOn(rootProject.tasks.named('prepareServerSmoke'))
}

[runClientSelftest: [dir: rootProject.camRunDirs.selftest, label: 'Selbsttest (NeoForge)'],
 runClientSmoke   : [dir: rootProject.camRunDirs.smoke, label: 'Rauchtest (NeoForge)'],
 runServerSmoke   : [dir: rootProject.camRunDirs.serverSmoke, label: 'Server-Rauchtest (NeoForge)', scanLog: true]].each { taskName, cfg ->
    tasks.matching { it.name == taskName }.configureEach { task ->
        def resultFile = file("${cfg.dir}/camdrones-selftest-result.txt")
        task.group = 'camdrones'
        task.doFirst { resultFile.delete() }
        task.doLast {
            if (!resultFile.exists()) {
                throw new GradleException("${cfg.label}: keine Ergebnisdatei – Spiel abgestürzt oder vorzeitig beendet?")
            }
            def result = resultFile.getText('UTF-8').trim()
            if (!result.startsWith('PASS')) {
                throw new GradleException("${cfg.label} fehlgeschlagen: ${result}")
            }
            if (cfg.scanLog) {
                def logFile = file("${cfg.dir}/logs/latest.log")
                if (!logFile.exists()) {
                    throw new GradleException("${cfg.label}: kein logs/latest.log")
                }
                def bad = logFile.readLines('UTF-8').findAll { line ->
                    line =~ /\/(ERROR|FATAL)\]/ || line.contains('MixinApplyError') || line.contains('InvalidMixinException') ||
                            line.contains('InvalidInjectionException') || line.contains('Mixin apply failed')
                }
                if (!bad.isEmpty()) {
                    throw new GradleException("${cfg.label}: ${bad.size()} Fehlerzeilen im Log, erste: ${bad.first()}")
                }
            }
            logger.lifecycle("${cfg.label}: ${result}")
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

neoForge {
    runs {
        clientSelftest {
            def only = project.findProperty('camdronesSelftestOnly')?.toString()?.trim()
            if (only) {
                systemProperty('camdrones.selftest.only', only)
            }
        }
    }
}

sourceSets {
    joinprobe {
    }
}

configurations {
    commonJoinprobeJava {
        canBeResolved = true
    }
}

dependencies {
    commonJoinprobeJava(project(path: ':common', configuration: 'commonJoinprobeJava'))
    joinprobeImplementation("de.lardtom:propwash-neoforge-${minecraft_version}:${propwash_version}")
}

neoForge {
    addModdingDependenciesTo(sourceSets.joinprobe)
    mods {
        camdrones_joinprobe {
            sourceSet sourceSets.joinprobe
        }
    }
    runs {
        clientNoAddon {
            client()
            sourceSet = sourceSets.joinprobe
            loadedMods = [mods.camdrones_joinprobe]
            gameDirectory = this.mkdir(this.file('runs/noaddon-client'))
        }
    }
}

tasks.named('compileJoinprobeJava', JavaCompile) {
    dependsOn(configurations.commonJoinprobeJava)
    source(configurations.commonJoinprobeJava)
}

tasks.matching { it.name == 'runClientNoAddon' }.configureEach { task ->
    def runDir = file('runs/noaddon-client')
    def resultFile = file('runs/noaddon-client/camdrones-selftest-result.txt')
    task.group = 'camdrones'
    task.dependsOn(rootProject.tasks.named('prepareRuns'))
    task.doFirst {
        runDir.mkdirs()
        def options = file("${rootProject.camRunDirs.smoke}/options.txt")
        if (options.exists()) {
            new File(runDir, 'options.txt').setText(options.getText('UTF-8'), 'UTF-8')
        }
        resultFile.delete()
    }
    task.doLast {
        if (!resultFile.exists()) {
            throw new GradleException('Beitrittstest ohne Add-on (NeoForge): keine Ergebnisdatei')
        }
        def result = resultFile.getText('UTF-8').trim()
        if (!result.startsWith('PASS')) {
            throw new GradleException("Beitrittstest ohne Add-on (NeoForge) fehlgeschlagen: ${result}")
        }
        logger.lifecycle("Beitrittstest ohne Add-on (NeoForge): ${result}")
    }
}

neoForge {
    runs.configureEach { run ->
        if (run.name != 'clientNoAddon') {
            run.loadedMods = [neoForge.mods.getByName(mod_id)]
        }
    }
}
